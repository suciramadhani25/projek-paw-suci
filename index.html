<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager Mahasiswa</title>

    <meta name="description"
        content="Aplikasi pengelolaan tugas kuliah mahasiswa.">

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <header>
        <h1>Task Manager Mahasiswa</h1>
        <p>Kelola tugas kuliahmu dengan lebih mudah!</p>
        <a href="/profil.html">Lihat Profil Saya</a>
    </header>

    <main>
        <section>
            <h2>Tambah Tugas Kuliah</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Masukkan nama tugas..."
                    required
                >

                <input
                    type="date"
                    id="deadlineInput"
                    required
                >

                <button type="submit">Tambah Tugas</button>
            </form>
        </section>

        <section>
            <h2>Daftar Tugas</h2>
            <div id="taskList"></div>
        </section>
    </main>

    <script type="module" src="/src/main.ts"></script>

</body>
</html>
